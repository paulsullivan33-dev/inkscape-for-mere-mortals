site_name: Inkscape for Mere Mortals
site_description: Drawing with vectors instead of pixels. Logos, diagrams and artwork stored as shapes and numbers, so the same small file prints sharp at any size, edited in Inkscape on your own machine, measured and exported from the command line as well as the mouse, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/inkscape-for-mere-mortals/
